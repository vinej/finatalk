services:
  postgres:
    image: postgres:16-alpine
    container_name: finatalk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: myapp
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - finatalk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  openbb:
    build:
      context: ../services/openbb
      dockerfile: Dockerfile
    container_name: finatalk_openbb
    restart: unless-stopped
    ports:
      - "6900:6900"
    env_file:
      - ../.env
    environment:
      OPENBB_API_PORT: "6900"
      OPENBB_API_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6900/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  finatalk_pgdata:
