[project]
name = "finatalk-openbb"
version = "0.1.0"
requires-python = ">=3.11"
description = "OpenBB Platform sidecar for FinaTalk"
dependencies = [
  "openbb>=4.3.0",
  "openbb-yfinance",
  "openbb-fmp",
  "openbb-sec",
  "openbb-finra",
  "openbb-fred",
  "openbb-cboe",
  "openbb-ecb",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
